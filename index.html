<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>OED TTMS</title>
    
    <!-- Prevent stale caching so every update loads instantly without hard refresh -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- الأيقونة الجديدة للمتصفح والديسكتوب و PWA Manifest -->
    <link rel="manifest" href="/manifest.json?v=5" />
    <link rel="icon" type="image/jpeg" href="/app-icon.jpg?v=5" />
    <link rel="apple-touch-icon" href="/app-icon.jpg?v=5" />
    
    <!-- تم تعديل الألوان لتدعم اللايت والدارك مود بشكل صحيح على الموبايل -->
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
